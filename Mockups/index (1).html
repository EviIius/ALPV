      ev('EV-001', 'Reconciliation and schema check, first test run', 'UAT', 4, 'first-run-checks.pdf', 120832, 'application/pdf'),
      ev('EV-002', 'Data quality results, first test run', 'UAT', 4, 'first-run-dq.csv', 15360, 'text/csv')
    ];
    k2.tests = [
      { id: 'AT-001', criterion: 'Row counts reconcile to the source for each delivery', expected: 'Matches the Source B month-end count', actual: 'Matched', outcome: 'Pass', evidence: 'EV-001' },
      { id: 'AT-002', criterion: 'Delivered file matches the contract schema', expected: 'All fields and types match', actual: 'All match', outcome: 'Pass', evidence: 'EV-001' },
      { id: 'AT-003', criterion: 'Data quality rules meet their thresholds', expected: 'Both rules at 100%', actual: 'Account status 96.9% complete', outcome: 'Fail', evidence: 'EV-002' }
    ];
    k2.seq = { issue: 1, ev: 2, rule: 2, test: 3 };
    review(k2, 'source', { outcome: 'Passed', reviewer: 'Source B data steward (sample)', why: 'Reconciles and conforms to the schema.', evidence: ['EV-001'] });
    review(k2, 'dq', { outcome: 'Failed', reviewer: 'Data quality reviewer (sample)', why: 'Account status is blank for 3.1% of accounts, all of them dormant accounts migrated from the legacy system.', checks: ['Rules cover every critical data element'], evidence: ['EV-002'] });
    review(k2, 'security', { outcome: 'Passed', reviewer: 'Security reviewer (sample)', why: 'No names or contact details in scope.', evidence: [] });
    k2.issues = [Object.assign(newIssue(k2, {}), {
      id: 'ISS-001', title: 'Account status blank for 3.1% of dormant accounts', from: 'Validation: Data quality review', severity: 'High', blocker: 'yes', status: 'Open',
      cause: 'Dormant accounts migrated from the legacy system without a status code.', action: 'Source B team backfills the status for migrated accounts. Then rerun AT-003.',
      owner: 'Source B team (sample)', due: dayISO(10), affected: 'AT-003, Data quality review', raisedBy: 'Data quality reviewer (sample)', raisedAt: dayISO(-3)
    })];
    k2.seq.issue = 1;
    k2.done = { scope: true, feasibility: true, terms: true, build: true };
    k2.view = 'validate';
    k2.log = [
      log(3, 15, 30, T, 'Data quality review returned for remediation. Raised ISS-001.'),
      log(3, 15, 10, T, 'Recorded the security review: passed.'),
      log(3, 14, 0, T, 'Recorded the source review: passed.'),
      log(4, 12, 0, T, 'Added EV-001 and EV-002 to the evidence register.'),
      log(6, 9, 45, T, 'Completed Schema, mapping and quality.'),
      log(9, 16, 20, 'S. Owner', 'The Source B team can backfill status for the migrated accounts if it comes up in testing.', 'comment'),
      log(10, 11, 0, T, 'Completed Contract terms.'),
      log(12, 10, 0, T, 'Completed Feasibility.'),
      log(14, 10, 0, T, 'Completed Scope and owners.'),
      k2.log[0]
    ];

    /* DC-0003: approved and active */
    const k3 = newContract(r, sC, { id: 'DC-0003', created: dayISO(-30), createdBy: T, ts: tsAgo(30, 9, 0) });
    Object.assign(k3.f, terms, {
      name: 'Source C auto loans linked to rated customers', sourceSteward: 'Source C data steward (sample)', targetSteward: 'Financial Crimes data steward (sample)', reuse: 'New contract',
      tier: 'Tier 3: moderate', reviews: ['source', 'dq', 'governance', 'target'], authority: 'Authoritative source', grain: 'One row per open auto loan at each month-end', history: 'Current month-end only',
      mechanism: 'Batch file', targetAssets: 'corporate_risk.fcr.loan_link', feasible: 'Feasible', feasibleWhy: 'Two fields from one table, already profiled.', classification: 'Internal',
      schedule: 'Monthly, business day 4, US Eastern time', freshness: 'Available by 09:00 ET on business day 4', retention: '3 years, then disposed of under the records schedule'
    });
    k3.schema = [
      { field: 'loan_id', type: 'string', definition: 'Unique identifier of the auto loan', nullable: 'No', key: 'Primary key', cls: 'Internal', units: 'LN-0000000', from: 'PDE' },
      { field: 'borrower_cust_id', type: 'string', definition: 'Customer identifier of the primary borrower', nullable: 'No', key: 'CDE', cls: 'Internal', units: '', from: 'PDE' }
    ];
    k3.mapping = [
      { source: 'auto_db.loan.loan_master.loan_id', target: 'loan_link.loan_id', transform: 'Direct', lineage: 'LIN-0301 (sample)', from: 'PDE' },
      { source: 'auto_db.loan.loan_master.borrower_cust_id', target: 'loan_link.cust_id', transform: 'Direct', lineage: 'LIN-0302 (sample)', from: 'PDE' }
    ];
    k3.rules = [
      { id: 'DQ-001', desc: 'Loan ID is present on every open loan', dim: 'Completeness', scope: 'loan_id', threshold: '100%', severity: 'High', freq: 'Every load', owner: 'Source C data steward (sample)', from: 'suggested' },
      { id: 'DQ-002', desc: 'Every borrower customer ID matches a customer in Source A', dim: 'Consistency', scope: 'borrower_cust_id', threshold: 'At least 99.5%', severity: 'High', freq: 'Monthly', owner: 'Data plane engineering', from: '' }
    ];
    k3.evidence = [ev('EV-001', 'Reconciliation and schema check, two test runs', 'UAT', 20, 'loan-link-checks.pdf', 98304, 'application/pdf'), ev('EV-002', 'Data quality results, two test runs', 'UAT', 20, 'loan-link-dq.csv', 7168, 'text/csv')];
    k3.tests = [
      { id: 'AT-001', criterion: 'Row counts reconcile to the source for each delivery', expected: 'Matches Source C', actual: 'Matched', outcome: 'Pass', evidence: 'EV-001' },
      { id: 'AT-002', criterion: 'Delivered file matches the contract schema', expected: 'All fields match', actual: 'All match', outcome: 'Pass', evidence: 'EV-001' },
      { id: 'AT-003', criterion: 'Data quality rules meet their thresholds', expected: 'Both rules at threshold', actual: '100% and 99.8%', outcome: 'Pass', evidence: 'EV-002' }
    ];
    k3.seq = { issue: 0, ev: 2, rule: 2, test: 3 };
    review(k3, 'source', { outcome: 'Passed', reviewer: 'Source C data steward (sample)', why: 'Reconciles on both runs.', evidence: ['EV-001'] });
    review(k3, 'dq', { outcome: 'Passed', reviewer: 'Data quality reviewer (sample)', why: 'Both rules at threshold.', evidence: ['EV-002'] });
    review(k3, 'governance', { outcome: 'Passed', reviewer: 'Governance reviewer (sample)', why: 'Internal data, use consistent with policy.', extra: 'CTL-0002 (sample)', evidence: [] });
    review(k3, 'target', { outcome: 'Passed', reviewer: 'Financial Crimes data steward (sample)', why: 'Links 99.8% of loans to rated customers.', extra: 'Loans to non-customers do not link and are left out.', evidence: ['EV-001'] });
    k3.done = { scope: true, feasibility: true, terms: true, build: true, validate: true };
    k3.frozen = { at: dayISO(-14), by: T, rev: 1 };
    k3.approvals = { source: { by: 'S. Owner', at: dayISO(-12), why: 'Two fields from one table, with no change to the source.' }, target: { by: 'K. Sponsor', at: dayISO(-11), why: 'Covers the loan link the model needs.' } };
    k3.act = { env: 'Production', planned: dayISO(-6), release: 'REL-SAMPLE-0042', auth: 'CHG-SAMPLE-0042', deployed: 'v1 · r1', access: 'Read access granted to the Financial Crimes model developer role.', monitoring: 'Ready', smoke: 'Passed', catalog: 'Yes' };
    k3.mon = { run: dayISO(-1), values: { 'DQ-001': '100%', 'DQ-002': '99.6%' }, delivery: 'On time' };
    k3.active = true; k3.activeAt = dayISO(-6); k3.view = 'monitor';
    k3.log = [
      log(1, 7, 10, T, 'Monitoring run: both rules met and delivery on time.'),
      log(6, 8, 30, T, 'Verified v1 · r1 in production (release REL-SAMPLE-0042, authorised under CHG-SAMPLE-0042) and activated it.'),
      log(11, 14, 10, 'K. Sponsor', 'Target owner accepted revision r1: Covers the loan link the model needs.'),
      log(12, 10, 5, 'S. Owner', 'Source owner approved revision r1: Two fields from one table, with no change to the source.'),
      log(14, 16, 0, T, 'Froze the approval package at revision r1. All 8 readiness gates passed.'),
      log(16, 11, 0, T, 'Completed Validation.'),
      log(20, 10, 0, T, 'Completed Schema, mapping and quality.'),
      log(24, 15, 0, T, 'Completed Contract terms.'),
      log(26, 10, 0, T, 'Completed Feasibility.'),
      log(28, 10, 0, T, 'Completed Scope and owners.'),
      k3.log[0]
    ];
    dcSeq = 3;
    return [k1, k2, k3];
  }
  state.contracts = seedContracts();


  /* ================= render and events ================= */
  const views = { request: viewRequest, mine: viewMine, howto: viewHowto, triage: viewTriage, contracts: viewContracts, demand: viewDemand, approvals: viewApprovals, definitions: viewDefinitions };
  function signedOutView() {
    return '<section class="panel signin"><span class="avatar avatar-lg" aria-hidden="true">?</span><h1>You are signed out</h1>' +
      '<p class="muted">This is where the company sign-in goes. In the real tool your identity, team and access come from the company authentication system before this page loads.</p>' +
      '<button type="button" class="btn btn-primary" data-act="sign-in">Sign in with company single sign-on</button>' +
      '<p class="muted small">Placeholder only. This mockup never asks for a username or password.</p></section>';
  }
  function renderUser() {
    const u = me();
    if (!state.signedIn) { userbox.innerHTML = '<span class="user-out">Not signed in</span>'; return; }
    const row = x => '<button type="button" class="user-opt" data-user="' + x.id + '" aria-pressed="' + (x.id === u.id) + '"><span class="avatar" aria-hidden="true">' + esc(x.initials) + '</span><span><b>' + esc(x.name) + '</b><small>' + esc(x.team) + '</small></span></button>';
    userbox.innerHTML = '<button type="button" class="user-chip" id="user-chip" data-user-act="toggle" aria-expanded="' + state.menuOpen + '" aria-controls="user-menu"><span class="avatar" aria-hidden="true">' + esc(u.initials) + '</span>' +
      '<span class="user-id"><b>' + esc(u.name) + '</b><small>' + esc(u.team) + '</small></span><span class="caret" aria-hidden="true">▾</span></button>' +
      (state.menuOpen ? '<div class="user-menu" id="user-menu" role="group" aria-label="Your profile"><div class="user-head"><span class="avatar avatar-lg" aria-hidden="true">' + esc(u.initials) + '</span><div><b>' + esc(u.name) + '</b><span class="muted small">' + esc(u.email) + '</span></div></div>' +
        '<dl class="user-facts"><dt>Employee ID</dt><dd class="mono">' + esc(u.empId) + '</dd><dt>Team</dt><dd>' + esc(u.team) + '</dd><dt>Access</dt><dd>' + ROLE_NAME[u.role] + '</dd>' +
        (u.owns ? '<dt>Owns</dt><dd>' + (u.owns.sources ? 'Source applications ' + esc(u.owns.sources[0] + ' to ' + u.owns.sources[u.owns.sources.length - 1]) : 'Target data in the corporate risk data plane') + '</dd>' : '') + '</dl>' +
        '<p class="muted small">Placeholder profile. In the real tool this comes from the company sign-in and directory, and your access decides which view you get.</p>' +
        '<p class="eyebrow">Demo: switch sample user</p><div class="user-list">' + USERS.map(row).join('') + '</div>' +
        '<button type="button" class="btn" data-user-act="signout">Sign out</button></div>' : '');
  }
  function render(focusId) {
    const a = document.activeElement, fid = focusId || (a && app.contains(a) ? a.id : '');
    renderUser();
    Object.keys(ROLE_VIEWS).forEach(k => { const b = document.getElementById('role-' + k); b.setAttribute('aria-pressed', String(state.signedIn && k === state.role)); b.disabled = !state.signedIn; });
    document.getElementById('tabbar').dataset.role = state.role;
    if (!state.signedIn) { app.innerHTML = signedOutView(); document.getElementById('tabs').innerHTML = ''; return; }
    app.innerHTML = views[state.view]();
    const counts = { triage: state.requests.length, mine: state.requests.filter(r => r.team === state.mineTeam).length, contracts: state.contracts.length, approvals: state.contracts.filter(k => waitingOn(k) === state.userId).length };
    document.getElementById('tabs').innerHTML = ROLE_VIEWS[state.role].map(v => '<button class="tab" role="tab" id="tab-' + v[0] + '" data-view="' + v[0] + '" aria-selected="' + (v[0] === state.view) + '">' + v[1] +
      (v[0] in counts ? '<span class="count">' + counts[v[0]] + '</span>' : '') + '</button>').join('');
    if (fid) { const el = document.getElementById(fid); if (el) el.focus({ preventScroll: !focusId }); }
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function show(view) {
    if (!ROLE_VIEWS[state.role].some(v => v[0] === view)) setRole(roleFor(view));
    state.view = view; state.errors.clear();
    try { history.replaceState(null, '', '#' + view); } catch (_) { /* hash is a convenience only */ }
    render(); window.scrollTo(0, 0);
  }
  function goStep(n) {
    state.step = n; state.errors.clear(); render('step-h'); window.scrollTo(0, 0);
  }
  function flag(items) {
    state.errors = new Set(items.map(x => 'draft.' + x.path));
    const first = items[0].path, row = /^sources\.(\d+)\.elements\.(\d+)\./.exec(first);
    if (row) { const src = state.draft.sources[Number(row[1])]; src.editing = Number(row[2]); src.showAll = true; }
    render();
    const el = document.getElementById(idOf('draft.' + first)) || app.querySelector('.f-bad input, .f-bad select, .f-bad textarea, .err');
    if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus({ preventScroll: true }); }
    toast(items.length === 1 ? '1 answer is missing on this step' : items.length + ' answers are missing on this step');
  }
  function copyText(text, msg) {
    const done = () => toast(msg || 'Questions copied');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      if (ok) done(); else toast('Copy is blocked here. Select the list and copy it by hand.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  const actions = {
    'go-step': t => goStep(Number(t.dataset.step)),
    back: () => goStep(state.step - 1),
    next: () => { const m = blocking(state.draft, stepsFor(state.draft)[state.step]); if (m.length) flag(m); else goStep(state.step + 1); },
    submit: () => {
      const m = blocking(state.draft), keys = stepsFor(state.draft);
      if (m.length) { state.step = Math.min(...m.map(x => keys.indexOf(x.step))); flag(m.filter(x => x.step === keys[state.step])); return; }
      const r = state.draft;
      r.id = 'SUB-' + String(state.nextNum++).padStart(4, '0');
      r.example = false; r.status = 'Not started'; r.submitted = new Date().toISOString().slice(0, 10);
      if (!hasData(r)) r.sources = [];
      if (!hasCaps(r)) r.caps = [];
      r.sources.forEach(s => { s.t.call = ''; });
      prepRequest(r);
      state.requests.unshift(r); fillOthers(r); state.picked = r.id; state.submittedId = r.id; state.mineTeam = r.team;
      state.draft = newRequest({ sources: [{}] }); state.step = 0; state.errors.clear();
      render(); window.scrollTo(0, 0);
    },
    'add-source': () => { state.draft.sources.push(newSource()); state.errors.delete('draft.sources'); render(); },
    'rm-source': t => { state.draft.sources.splice(Number(t.dataset.i), 1); state.errors.clear(); render(); },
    'add-el': t => { const i = Number(t.dataset.i), s = state.draft.sources[i]; s.elements.push(newElement()); s.editing = s.elements.length - 1; s.showAll = true; state.errors.delete('draft.sources.' + i + '.elements'); render(idOf('draft.sources.' + i + '.elements.' + (s.elements.length - 1) + '.name')); },
    'rm-el': t => { const s = state.draft.sources[Number(t.dataset.i)], j = Number(t.dataset.j); s.elements.splice(j, 1); s.editing = s.editing === j ? -1 : s.editing > j ? s.editing - 1 : s.editing; state.errors.clear(); render(); },
    'edit-el': t => { const s = state.draft.sources[Number(t.dataset.i)], j = Number(t.dataset.j); s.editing = s.editing === j ? -1 : j; render('edit-' + t.dataset.i + '-' + j); },
    'show-all': t => { const s = state.draft.sources[Number(t.dataset.i)]; s.showAll = !s.showAll; render(); },
    'team-show-all': t => { const s = state.requests[Number(t.dataset.r)].sources[Number(t.dataset.s)]; s.tAll = !s.tAll; render(); },
    'dl-template': () => saveFile('PDE-requirements-template.xlsx', buildTemplate(state.draft.sources)),
    'clear-draft': () => { state.draft = newRequest({ sources: [{}] }); state.step = 0; state.errors.clear(); render(); toast('Form cleared'); },
    'load-example': () => { state.draft = exampleDraft(); state.errors.clear(); render(); },
    'open-triage': () => { state.submittedId = ''; show('triage'); },
    'sign-in': () => { state.signedIn = true; render(); },
    'see-mine': () => { state.submittedId = ''; show('mine'); },
    'draft-next': t => {
      const r = state.requests[Number(t.dataset.r)], s = r.sources[Number(t.dataset.s)], list = questions(r).filter(q => q.who === srcName(s));
      s.t.next = list.length ? list.map(q => '- ' + q.text).join('\n') : 'No open questions. Ready for the next step.';
      stamp('requests.' + t.dataset.r + '.sources.' + t.dataset.s + '.t.next');
      render(idOf('requests.' + t.dataset.r + '.sources.' + t.dataset.s + '.t.next'));
    },
    'new-request': () => { state.submittedId = ''; render(); },
    pick: t => { state.picked = t.dataset.id; render(); },
    'pick-src': t => { state.requests[Number(t.dataset.r)].sel = Number(t.dataset.s); render(); },
    'add-held': t => {
      const i = Number(t.dataset.i), s = state.draft.sources[i], h = cat(s.catalog).held, col = h.cols[Number(t.dataset.n)];
      s.elements = s.elements.filter(e => filled(e.name) || keyCount(e) > 0 || filled(e.definition));
      s.elements.push(newElement({ name: col[1], fieldType: 'field', key: { db: h.db, schema: h.schema, table: h.table, element: col[0] } }));
      s.heldOpen = true; state.errors.clear(); render();
    },
    'see-example': () => { state.draft = exampleDraft(); state.submittedId = ''; state.step = 0; show('request'); },
    'start-blank': () => { state.draft = newRequest({ sources: [{}] }); state.submittedId = ''; state.step = 0; show('request'); },
    'copy-q': t => { const r = state.requests[Number(t.dataset.r)]; copyText('Questions on ' + r.id + ' ' + r.title + '\n\n' + groupQ(questions(r)).map(g => g.who + '\n' + g.items.map(t => '- ' + t).join('\n')).join('\n\n')); }
  };
  Object.assign(actions, capActions(), contractActions(), lifecycleActions());

  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || !app.contains(t) || t.disabled) return;
    actions[t.dataset.act](t);
  });
  app.addEventListener('input', e => {
    const t = e.target, p = t.dataset.bind;
    let p0 = '';
    if (!p || t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT') return;
    set(p, t.value); stamp(p);
    if (p.startsWith('contracts.')) contractInput(p, t);
    if (p.endsWith('.t.others')) { const n = document.getElementById(idOf(p) + '-n'); if (n) n.textContent = countTeams(t.value); }
    let holder = t;
    if (p.includes('.key.')) {
      const ep = p.split('.key.')[0], chip = t.closest('.keyset').querySelector('.chip');
      if (chip) chip.outerHTML = keyChip(get(ep));
    }
    if (state.errors.delete(p0 || p)) { const f = holder.closest('.f'); if (f) { f.classList.remove('f-bad'); const er = f.querySelector('.err'); if (er) er.remove(); } }
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.upload) { importAll(t.files[0]); return; }
    if (t.dataset.evfile) { evidenceFile(t); return; }
    if (t.dataset.bindset) {
      const p = t.dataset.bindset, arr = get(p), i = arr.indexOf(t.value);
      if (t.checked && i < 0) arr.push(t.value); else if (!t.checked && i >= 0) arr.splice(i, 1);
      if (p.startsWith('contracts.')) contractEdited(p, t);
      state.errors.delete(p); render(); return;
    }
    const p = t.dataset.bind;
    if (!p) return;
    const live = t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT';
    if (live) set(p, t.type === 'checkbox' ? t.checked : t.value);
    if (p.startsWith('contracts.')) contractEdited(p, t);
    if (!live) return;
    stamp(p);
    if (/^draft\.sources\.\d+\.catalog$/.test(p)) { const c = cat(t.value); get(p.replace(/\.catalog$/, '')).appId = c ? c.appId : ''; }
    if (p === 'draft.type') { ensureParts(state.draft); state.errors.clear(); }
    const cm = /^requests\.(\d+)\.caps\.(\d+)\.t\.contract$/.exec(p);
    if (cm) { const r = state.requests[Number(cm[1])]; syncCapContract(r.caps[Number(cm[2])], r); }
    state.errors.delete(p); render();
  });
  app.addEventListener('toggle', e => { const p = e.target.dataset && e.target.dataset.open; if (p) set(p, e.target.open); }, true);
  document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('[data-view]'); if (t) { state.openContract = ''; show(t.dataset.view); } });
  document.querySelector('.role-sw').addEventListener('click', e => { const t = e.target.closest('[data-role]'); if (t && state.signedIn && t.dataset.role !== state.role) { setRole(t.dataset.role); state.openContract = ''; show(ROLE_VIEWS[state.role][0][0]); } });
  userbox.addEventListener('click', e => {
    const opt = e.target.closest('[data-user]'), act = e.target.closest('[data-user-act]');
    if (opt) { setUser(opt.dataset.user); state.menuOpen = false; state.submittedId = ''; state.openContract = ''; show(ROLE_VIEWS[state.role][0][0]); document.getElementById('user-chip').focus(); }
    else if (act && act.dataset.userAct === 'toggle') { state.menuOpen = !state.menuOpen; renderUser(); document.getElementById('user-chip').focus(); }
    else if (act && act.dataset.userAct === 'signout') { state.signedIn = false; state.menuOpen = false; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener('click', e => { if (state.menuOpen && !e.composedPath().includes(userbox)) { state.menuOpen = false; renderUser(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.menuOpen) { state.menuOpen = false; renderUser(); document.getElementById('user-chip').focus(); } });

  const start = (location.hash || '').slice(1);
  if (VIEWS.includes(start)) { state.view = start; if (!ROLE_VIEWS[state.role].some(v => v[0] === start)) setRole(roleFor(start)); }
  render();
})();
</script>
