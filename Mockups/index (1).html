<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR Intake Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: a red bar with a gold rule switches four views; the request view is a step rail beside one form panel,
   the team views are summary first, then tables that scroll inside their own frame.
   Yellow marks what the requestor told us, blue marks what the data team added, as in the team's workbook. */
:root {
  --bg: #F5F3F1;
  --surface: #FFFFFF;
  --surface-2: #EBE7E3;
  --ink: #221E1C;
  --muted: #655D58;
  --line: #DBD5CF;
  --line-strong: #B8AFA8;
  --accent: #C5161F;
  --accent-fill: #D71E28;
  --accent-ink: #FFFFFF;
  --head: #D71E28;
  --head-ink: #FFFFFF;
  --gold: #FFCD41;
  --gold-ink: #221E1C;
  --sel: #FFF3CC;
  --sel-line: #B98A00;
  --req: #FFE9A6;
  --req-ink: #6A4900;
  --team: #D7E5F6;
  --team-ink: #1D4B77;
  --good: #1B7A4B;
  --good-soft: #DFF3E8;
  --warn: #99480A;
  --warn-soft: #FCE6D3;
  --crit: #A8131B;
  --crit-soft: #FBE3E4;
  --bar: #5A514C;
  --font-display: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151211; --surface: #201C1A; --surface-2: #2C2724; --ink: #F2EDE9; --muted: #B3A9A2;
    --line: #3A3330; --line-strong: #564D48; --accent: #FF8086; --accent-fill: #D71E28; --accent-ink: #FFFFFF;
    --head: #B3161E; --head-ink: #FFFFFF; --gold: #FFCD41; --gold-ink: #221E1C; --sel: #3B2F0E; --sel-line: #D6A419;
    --req: #45370F; --req-ink: #FFD970; --team: #1B3148; --team-ink: #B9D4F1;
    --good: #62C794; --good-soft: #143524; --warn: #F2A96C; --warn-soft: #41270F;
    --crit: #FF9497; --crit-soft: #4A1719; --bar: #CFC5BE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151211; --surface: #201C1A; --surface-2: #2C2724; --ink: #F2EDE9; --muted: #B3A9A2;
  --line: #3A3330; --line-strong: #564D48; --accent: #FF8086; --accent-fill: #D71E28; --accent-ink: #FFFFFF;
  --head: #B3161E; --head-ink: #FFFFFF; --gold: #FFCD41; --gold-ink: #221E1C; --sel: #3B2F0E; --sel-line: #D6A419;
  --req: #45370F; --req-ink: #FFD970; --team: #1B3148; --team-ink: #B9D4F1;
  --good: #62C794; --good-soft: #143524; --warn: #F2A96C; --warn-soft: #41270F;
  --crit: #FF9497; --crit-soft: #4A1719; --bar: #CFC5BE;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ol, ul, fieldset, legend { margin: 0; padding: 0; }
fieldset { border: 0; min-width: 0; }
ol, ul { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bar :focus-visible { outline-color: var(--gold); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--head); color: var(--head-ink);
}
.bar-in {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { display: grid; grid-template-columns: 9px 9px; gap: 2px; }
.brand-mark i { width: 9px; height: 9px; border-radius: 2px; background: var(--head-ink); }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { background: var(--gold); }
.brand-name { font: 600 16px/1.2 var(--font-display); }
.brand-sub { font-size: 12px; opacity: .9; }
.bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.role-sw { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.role:disabled { opacity: .5; cursor: default; }
.userbox { position: relative; }
.avatar { display: inline-grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font: 600 12px var(--font-body); letter-spacing: .02em; }
.avatar-lg { width: 44px; height: 44px; font-size: 15px; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 4px; border-radius: 999px; cursor: pointer; text-align: left;
  border: 1px solid color-mix(in srgb, var(--head-ink) 60%, transparent); background: color-mix(in srgb, var(--head-ink) 12%, transparent); color: var(--head-ink); }
.user-chip:hover { background: color-mix(in srgb, var(--head-ink) 22%, transparent); }
.user-id { display: flex; flex-direction: column; line-height: 1.15; }
.user-id b { font-weight: 600; font-size: 13px; }
.user-id small { font-size: 11px; opacity: .9; }
.caret { font-size: 11px; }
.user-out { font-size: 13px; opacity: .9; }
.user-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(320px, calc(100vw - 32px)); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 22%, transparent); }
.user-menu :focus-visible { outline-color: var(--ink); }
.user-head { display: flex; align-items: center; gap: 12px; }
.user-head > div { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.user-facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.user-facts dt { color: var(--muted); }
.user-facts dd { margin: 0; }
.user-list { display: flex; flex-direction: column; gap: 4px; }
.user-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; text-align: left; }
.user-opt:hover { background: var(--surface-2); }
.user-opt[aria-pressed="true"] { background: var(--sel); border-color: var(--sel-line); }
.user-opt span:last-child { display: flex; flex-direction: column; line-height: 1.2; }
.user-opt b { font-weight: 600; font-size: 14px; }
.user-opt small { font-size: 12px; color: var(--muted); }
.whoami { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--bg); }
.whoami-text { display: flex; flex-direction: column; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.signin { align-items: center; text-align: center; max-width: 520px; margin: 40px auto; }
.signin h1 { font: 600 24px/1.2 var(--font-display); }
.role-lab { font-size: 12px; opacity: .9; margin-right: 2px; }
.role {
  border: 1px solid color-mix(in srgb, var(--head-ink) 60%, transparent); background: none; color: var(--head-ink);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px;
}
.role:hover { background: color-mix(in srgb, var(--head-ink) 18%, transparent); }
.role[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.tabbar { border-top: 4px solid var(--gold); background: var(--req); color: var(--req-ink); border-bottom: 1px solid var(--line); }
.tabbar[data-role="team"] { background: var(--team); color: var(--team-ink); }
.tabbar[data-role="owner"] { background: var(--surface-2); color: var(--ink); }
.tabbar :focus-visible { outline-color: var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; max-width: 1180px; margin: 0 auto; padding: 6px 20px; }
.tab {
  border: 1px solid transparent; background: none; padding: 5px 12px; border-radius: var(--r);
  cursor: pointer; font-weight: 500; font-size: 14px; color: inherit;
}
.tab:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.tab .count { font: 500 12px var(--font-mono); margin-left: 6px; }

/* ---------- page frame ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.view-head { display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.view-head h1 { font: 600 26px/1.2 var(--font-display); text-wrap: balance; }
.view-head p { color: var(--muted); }
.eyebrow { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h2 { font: 600 19px/1.25 var(--font-display); text-wrap: balance; }
h3 { font: 600 15px/1.3 var(--font-body); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
.btn-primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.btn-quiet { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn-quiet:hover { background: var(--sel); border-color: transparent; }
.btn-danger:hover { border-color: var(--crit); color: var(--crit); background: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- survey ---------- */
.survey { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 124px); display: flex; flex-direction: column; gap: 16px; }
.steps { display: flex; flex-direction: column; gap: 2px; counter-reset: step; }
.step {
  counter-increment: step; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center;
  width: 100%; text-align: left; border: 0; background: none; padding: 8px; border-radius: var(--r); cursor: pointer; color: var(--muted);
}
.step::before {
  content: counter(step); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line-strong); font: 500 12px var(--font-mono); color: var(--muted); background: var(--surface);
}
.step:hover { background: var(--surface-2); }
.step[aria-current="step"] { color: var(--ink); font-weight: 600; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.step[aria-current="step"]::before { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
.step.done::before { content: "\2713"; background: var(--good-soft); border-color: var(--good); color: var(--good); }
.step small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.rail-note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel-head { display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.panel-head p { color: var(--muted); }
.panel-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px; border-radius: var(--r); background: var(--sel); color: var(--ink); font-size: 14px; }
.banner strong { font-weight: 600; }
.note { padding: 10px 14px; border-radius: var(--r); background: var(--surface-2); color: var(--ink); font-size: 14px; }
.note-team { background: var(--team); color: var(--team-ink); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.f-wide { grid-column: 1 / -1; }
.f > label, .f > legend { font-weight: 500; font-size: 14px; }
.opt { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
.hint { font-size: 13px; color: var(--muted); }
.f input[type="text"], .f input[type="email"], .f input[type="date"], .f input[type="number"], .f select, .f textarea, .cell-in {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); min-width: 0;
}
.f textarea { resize: vertical; min-height: 64px; }
.f input:hover, .f select:hover, .f textarea:hover { border-color: var(--muted); }
.f-bad input, .f-bad select, .f-bad textarea, .f-bad .choices { border-color: var(--crit); }
.f-bad .choices { box-shadow: inset 3px 0 0 var(--crit); padding-left: 10px; }
.err { font-size: 13px; color: var(--crit); font-weight: 500; }
.choices { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.choices.stack { flex-direction: column; }
.choice { display: inline-flex; align-items: flex-start; gap: 7px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); cursor: pointer; font-size: 14px; background: var(--surface); }
.choice:hover { border-color: var(--muted); }
.choice input { margin: 3px 0 0; accent-color: var(--accent-fill); }
.choice:has(input:checked) { background: var(--sel); border-color: var(--sel-line); }

/* source and element blocks */
.block { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; background: var(--surface-2); border-radius: 8px 8px 0 0; }
.block-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
.block-title .n { font: 500 12px var(--font-mono); color: var(--muted); }
.block-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.sub { border-top: 1px dashed var(--line-strong); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.el { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.el-n { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 28px; }
.el-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.keyset { background: var(--bg); border-radius: var(--r); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.keyset-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }
.keyset-h b { font-weight: 600; font-size: 14px; }
.key-in { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.5fr); gap: 8px 10px; align-items: end; }
.key-in .f > label { font-weight: 400; font-size: 12px; color: var(--muted); }
.f input.mono { font-family: var(--font-mono); font-size: 13px; }
.keytext { overflow-wrap: anywhere; }
table.els td:first-child { min-width: 190px; }
table.els td:nth-child(2) { min-width: 150px; }
table.els td:nth-child(5) { min-width: 150px; }
table.els .stack { min-width: 200px; }
table.els .key4-in { max-width: 330px; }
.stack { display: flex; flex-direction: column; gap: 6px; min-width: 250px; }
.upload { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
.upload-text { display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px; min-width: 0; max-width: 66ch; }
.btn-file { position: relative; }
.btn-file:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.el-edit { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
.bulk { border: 1px solid var(--line-strong); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.bulk-head { display: flex; flex-direction: column; gap: 2px; }
.bulk-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: bulk; }
.bulk-steps li { counter-increment: bulk; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border-radius: var(--r); background: var(--bg); }
.bulk-steps li > b::before { content: counter(bulk) ". "; font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.bulk-steps .btn { margin-top: auto; }
.bulk-result { display: flex; flex-direction: column; gap: 6px; }
table.pde td { vertical-align: middle; }
table.pde { table-layout: fixed; min-width: 720px; }
table.pde th:nth-child(1) { width: 48px; }
table.pde th:nth-child(2) { width: 24%; }
table.pde th:nth-child(3) { width: 26%; }
table.pde th:nth-child(4) { width: 116px; }
table.pde th:nth-child(6) { width: 140px; }
table.pde td { overflow-wrap: anywhere; }
table.pde tr.bad > td { background: var(--crit-soft); }
table.pde tr.edit-row > td { background: var(--bg); padding: 14px; }
table.pde .btn-quiet { padding: 4px 8px; }

/* worked comparison */
.compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.compare > div { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.compare dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; }
.compare dt { color: var(--muted); }
.compare dd { margin: 0; overflow-wrap: anywhere; }
.quote { font: 500 15px/1.4 var(--font-display); }

/* ---------- chips, pills, meters ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink); }
.chip-req { background: var(--req); color: var(--req-ink); }
.chip-team { background: var(--team); color: var(--team-ink); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-crit { background: var(--crit-soft); color: var(--crit); }
.meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.meter-track { flex: 1 1 120px; max-width: 220px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; background: var(--bar); }
.meter b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line-strong); }
.sw-req { background: var(--req); } .sw-team { background: var(--team); }

/* ---------- review ---------- */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
.kv { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kv span { font-size: 12px; color: var(--muted); }
.kv b { font-weight: 500; overflow-wrap: anywhere; }
.qgroups { columns: 320px 3; column-gap: 28px; }
.qgroup { break-inside: avoid; padding-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
.qgroup h4 { font: 600 13px/1.4 var(--font-body); }
.qgroup ul { display: flex; flex-direction: column; gap: 5px; }
.qgroup li { font-size: 14px; padding-left: 14px; position: relative; }
.qgroup li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
.done-card { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.req-id { font: 500 14px var(--font-mono); }

/* ---------- team views ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 600 26px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.scroll { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

  function checklist(r) {

  }

  /* ================= platform capability requests ================= */
  /* Besides data, a requester can ask for something the platform does not do yet: new data quality rules, a change to a rule,
     or a change to the framework itself. Each ask gets a CAP ID and its own rows in triage, next to the source rows. */
  const REQ_TYPES = [
    ['data', 'Data brought into the platform'],
    ['capability', 'A new or enhanced platform capability, such as new data quality rules or a change to the framework'],
    ['both', 'Both: data, and a platform capability that goes with it']
  ];
  const REQ_TYPE_SHORT = [['data', 'Data'], ['capability', 'Platform capability'], ['both', 'Data and a platform capability']];
  const CAP_TYPES = [
    ['dq-new', 'New data quality rules'],
    ['dq-change', 'Change to an existing data quality rule'],
    ['framework', 'Change to the data quality or controls framework'],
    ['feature', 'New platform feature or tool'],
    ['delivery', 'Change to how data is delivered or accessed'],
    ['other', 'Something else']
  ];
  const FRAMEWORK_AREAS = ['Rule types', 'Thresholds and scoring', 'Exceptions and workflow', 'Results and reporting', 'Ownership and roles', 'Other'];
  const DQ_DIMS = ['Completeness', 'Validity', 'Accuracy', 'Consistency', 'Timeliness', 'Uniqueness'];
  const SEVERITY = ['Critical', 'High', 'Medium', 'Low'];
  const RULE_FREQ = ['Every load', 'Daily', 'Weekly', 'Monthly'];
  const THRESHOLDS = ['100%', 'At least 99.5%', 'At least 99%', 'At least 95%', 'Zero exceptions'];
  const CAP_EXISTS = ['Yes', 'Partly', 'No'];
  const CAP_DECISION = ['Add to the backlog', 'Already supported: show them how', 'Fold into a data contract', 'Needs a design review', 'Decline'];
  const CAP_SIZE = ['S', 'M', 'L', 'XL'];
  const CAP_OWNER = ['Data plane engineering', 'Data quality framework team', 'Platform operations', 'Data governance'];
  const CAP_STATUS = ['Not started', 'In review', 'Questions sent', 'Accepted', 'In delivery', 'Done', 'Declined'];

  const isDQ = c => c.capType === 'dq-new' || c.capType === 'dq-change';
  const hasData = r => r.type !== 'capability';
  const hasCaps = r => r.type === 'capability' || r.type === 'both';
  const capName = c => c.title.trim() || labelOf(CAP_TYPES, c.capType) || 'Untitled capability';

  function newRule(o) { return Object.assign({ id: nid('q'), target: '', dimension: '', logic: '', threshold: '', severity: '', freq: '' }, o); }
  function newCap(o) {
    o = o || {};
    return Object.assign({
      id: nid('c'), capType: '', title: '', area: '', problem: '', proposal: '', acceptance: '', applies: [], scope: '',
      priority: '', priorityWhy: '', neededBy: '', regulatory: '', regDetail: '', benefit: [], workaround: ''
    }, o, {
      applies: (o.applies || []).slice(), benefit: (o.benefit || []).slice(),
      rules: (o.rules || []).map(newRule),
      t: Object.assign({ capId: '', exists: '', decision: '', size: '', owner: '', target: '', status: '', contract: '', next: '', by: '', at: '' }, o.t)
    });
  }
  let capSeq = 0;
  function prepCaps(r) {
    (r.caps || []).forEach(c => {
      if (!c.t.status) c.t.status = 'Not started';
      if (!c.t.capId) c.t.capId = 'CAP-' + String(++capSeq).padStart(3, '0');
    });
  }
  /* Switching what the request is for makes sure the matching part has something to fill in. */
  function ensureParts(d) {
    if (hasCaps(d) && !d.caps.length) d.caps.push(newCap());
    if (hasData(d) && !d.sources.length) d.sources.push(newSource());
  }

  function capChecks(r, add) {
    add('caps', 'caps', r.caps.length > 0);
    r.caps.forEach((c, i) => {
      const p = 'caps.' + i + '.';
      ['capType', 'title', 'problem', 'proposal', 'priority', 'regulatory'].forEach(k => add('caps', p + k, filled(c[k])));
      add('caps', p + 'acceptance', filled(c.acceptance), true);
      if (c.capType === 'framework') add('caps', p + 'area', filled(c.area), true);
      if (c.regulatory === 'yes') add('caps', p + 'regDetail', filled(c.regDetail));
      if (isDQ(c)) {
        add('caps', p + 'rules', c.rules.length > 0);
        c.rules.forEach((x, j) => {
          add('caps', p + 'rules.' + j + '.logic', filled(x.logic));
          add('caps', p + 'rules.' + j + '.target', filled(x.target), true);
          add('caps', p + 'rules.' + j + '.threshold', filled(x.threshold), true);
        });
      } else add('caps', p + 'scope', filled(c.scope) || c.applies.length > 0, true);
    });
  }
  function capQuestions(r, ask) {
    r.caps.forEach(c => {
      const who = 'Capability: ' + capName(c);
      if (!filled(c.problem)) ask(who, 'What problem does this solve, and what happens today without it?');
      if (!filled(c.proposal)) ask(who, 'What should the platform do? Describe the outcome rather than the design.');
      if (!filled(c.acceptance)) ask(who, 'How will you know it works? One or two acceptance criteria are enough.');
      if (isDQ(c)) {
        if (!c.rules.length) ask(who, 'Which rules do you need? For each one, name the data element, what it should check and the threshold.');
        const noT = c.rules.filter(x => !filled(x.threshold)), noEl = c.rules.filter(x => !filled(x.target));
        if (noT.length) ask(who, 'What threshold should ' + (noT.length === 1 ? 'the rule' : 'each rule') + ' meet? ' + noT.length + (noT.length === 1 ? ' rule has' : ' rules have') + ' none.');
        if (noEl.length) ask(who, 'Which data element does ' + (noEl.length === 1 ? 'the rule' : 'each rule') + ' check? A field name or four-part key helps us place it.');
      } else if (!filled(c.scope) && !c.applies.length) ask(who, 'Which sources, tables or data elements does it apply to?');
      if (c.capType === 'framework' && !filled(c.area)) ask(who, 'Which part of the framework would change?');
      if (!filled(c.regulatory) || c.regulatory === 'unknown') ask(who, 'Is this regulatory driven? Yes only if a regulation, regulatory commitment, exam finding or policy mandate requires it.');
      if (filled(c.priority) && !filled(c.priorityWhy)) ask(who, 'What is the rationale for the priority? It lets us compare it with other asks.');
    });
  }

  /* Cell inputs shared by the capability and contract tables. */
  const cIn = (path, aria, o) => {
    o = o || {};
    return '<input class="cell-in' + (o.mono ? ' mono' : '') + '" type="' + (o.type || 'text') + '" id="' + idOf(path) + '" data-bind="' + path + '" value="' + esc(get(path)) + '" placeholder="' + esc(o.ph || '') +
      '" aria-label="' + esc(aria) + '"' + (o.list ? ' list="' + o.list + '"' : '') + (o.ro ? ' readonly' : '') + '>';
  };
  const cSel = (path, options, aria, o) => {
    o = o || {};
    const v = get(path);
    return '<select class="cell-in" id="' + idOf(path) + '" data-bind="' + path + '" aria-label="' + esc(aria) + '"' + (o.ro ? ' disabled' : '') + '><option value="">' + esc(o.blank || 'Not set') + '</option>' +
      options.map(norm).map(([val, lab, dis]) => '<option value="' + esc(val) + '"' + (val === v ? ' selected' : '') + (dis && val !== v ? ' disabled' : '') + '>' + esc(lab) + '</option>').join('') + '</select>';
  };
  const decisionChip = d => d ? '<span class="chip ' + ({ 'Add to the backlog': 'chip-team', 'Fold into a data contract': 'chip-good', 'Already supported: show them how': 'chip-good', 'Decline': 'chip-crit', 'Needs a design review': 'chip-warn' }[d] || '') + '">' + esc(d) + '</span>' : '<span class="muted">Not set</span>';

  /* ---------- requester: the capability step ---------- */
  function ruleTable(c, i, d) {
    const p = 'draft.caps.' + i + '.rules.', lid = 'rule-els-' + i;
    const names = [...new Set(d.sources.flatMap(s => els(s).map(elName)))];
    const rows = c.rules.map((x, j) => {
      const rp = p + j + '.', n = j + 1, bad = state.errors.has(rp + 'logic');
      return '<tr' + (bad ? ' class="bad"' : '') + '><td>' + cIn(rp + 'target', 'Data element for rule ' + n, { ph: 'Element name or four-part key', list: names.length ? lid : '' }) + '</td>' +
        '<td>' + cSel(rp + 'dimension', DQ_DIMS, 'Dimension for rule ' + n) + '</td>' +
        '<td><textarea class="cell-in" rows="2" id="' + idOf(rp + 'logic') + '" data-bind="' + rp + 'logic" aria-label="Rule ' + n + ' in plain words" placeholder="For example: every active record has a value">' + esc(x.logic) + '</textarea>' + (bad ? '<p class="err">Describe the rule.</p>' : '') + '</td>' +
        '<td>' + cIn(rp + 'threshold', 'Threshold for rule ' + n, { ph: '100%', list: 'rule-thr' }) + '</td>' +
        '<td>' + cSel(rp + 'severity', SEVERITY, 'Severity for rule ' + n) + '</td>' +
        '<td>' + cSel(rp + 'freq', RULE_FREQ, 'How often to check rule ' + n) + '</td>' +
        '<td><button type="button" class="btn btn-quiet btn-danger" data-act="rm-rule" data-i="' + i + '" data-j="' + j + '" aria-label="Remove rule ' + n + '">Remove</button></td></tr>';
    }).join('');
    return '<div class="sub"><h3>Rules</h3><p class="muted small">One row per rule. Name the data element, say what it should check in plain words, and the threshold it must meet. We turn it into rule logic.</p>' +
      (state.errors.has('draft.caps.' + i + '.rules') ? '<p class="err">Add at least one rule.</p>' : '') +
      (names.length ? '<datalist id="' + lid + '">' + names.map(x => '<option value="' + esc(x) + '"></option>').join('') + '</datalist>' : '') +
      (c.rules.length ? '<div class="scroll"><table class="rules"><thead><tr><th>Data element it checks</th><th>Dimension</th><th>The rule, in plain words</th><th>Threshold</th><th>Severity if it fails</th><th>How often</th><th><span class="vh">Remove</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') +
      '<div><button type="button" class="btn" data-act="add-rule" data-i="' + i + '">Add a rule</button></div></div>';
  }
  function capBlock(c, i, d) {
    const p = 'draft.caps.' + i + '.';
    const srcOpts = hasData(d) ? d.sources.filter(s => s.catalog && (s.catalog !== 'other' || filled(s.name))).map(s => [srcKey(s), srcName(s)]) : [];
    return '<div class="block"><div class="block-head"><div class="block-title"><span class="n">Capability ' + (i + 1) + '</span><h3>' + esc(c.title.trim() || labelOf(CAP_TYPES, c.capType) || 'New capability') + '</h3></div>' +
      (d.caps.length > 1 || hasData(d) ? '<button type="button" class="btn btn-quiet btn-danger" data-act="rm-cap" data-i="' + i + '">Remove capability</button>' : '') + '</div>' +
      '<div class="block-body"><div class="grid2">' +
      fSelect('What kind of capability?', p + 'capType', CAP_TYPES) +
      fText('Short title', p + 'title', { ph: 'For example: completeness rules for third-party data' }) +
      (c.capType === 'framework' ? fSelect('Which part of the framework?', p + 'area', FRAMEWORK_AREAS) + '<span></span>' : '') +
      fText('What problem does it solve?', p + 'problem', { wide: true, area: true, hint: 'What happens today without it, and who is affected.' }) +
      fText('What should the platform do?', p + 'proposal', { wide: true, area: true, hint: 'Describe the outcome you need, not the technical design.' }) +
      fText('How will we know it works?', p + 'acceptance', { wide: true, area: true, rows: 2, hint: 'One or two acceptance criteria.' }) +
      (srcOpts.length ? fChecks('Which sources in this request does it apply to?', p + 'applies', srcOpts, { wide: true, opt: true, hint: 'Rules for a source travel with it into its data contract.' }) : '') +
      fText(srcOpts.length ? 'Anything else it applies to' : 'Which sources, tables or data elements does it apply to?', p + 'scope', { wide: true, opt: true, ph: 'Source, table or element names, or a four-part key' }) +
      '</div>' + (isDQ(c) ? ruleTable(c, i, d) : '') +
      '<div class="sub"><div class="grid2">' +
      fRadios('Priority', p + 'priority', PRIORITY) +
      fText('Priority rationale', p + 'priorityWhy', { ph: 'For example: the committee pack goes out without it' }) +
      fText('Needed by', p + 'neededBy', { type: 'date', opt: true }) + '<span></span>' +
      fRadios('Regulatory driven?', p + 'regulatory', YESNOUNK, { hint: 'Yes only if a regulation, regulatory commitment, exam finding or policy mandate requires it.' }) +
      (c.regulatory === 'yes' ? fText('Regulation or requirement', p + 'regDetail', { hint: 'Cite it, with the section if you can.' }) : '<span></span>') +
      fChecks('Which other teams would benefit?', p + 'benefit', TEAMS.filter(t => t !== d.team && t !== 'Other'), { wide: true, opt: true, hint: 'Helps us see when one change serves several risk areas.' }) +
      fText('How do you work around it today?', p + 'workaround', { wide: true, opt: true }) +
      '</div></div></div></div>';
  }
  function stepCaps() {
    const d = state.draft;

  function capReview(d) {

      (d.caps.map(c => '<tr><td><b>' + esc(capName(c)) + '</b>' + (filled(c.problem) ? '<br><span class="muted small">' + esc(c.problem.length > 140 ? c.problem.slice(0, 137) + '...' : c.problem) + '</span>' : '') + '</td>' +

        '<td class="num">' + (isDQ(c) ? c.rules.length : '<span class="muted">n/a</span>') + '</td></tr>').join('') || '<tr><td colspan="6" class="muted">No capabilities added.</td></tr>') +

  }

  /* ---------- requester: submitted requests ---------- */
  function capMine(r) {
    if (!r.caps.length) return '';
    return '<div class="scroll"><table><thead><tr class="grp"><th class="c-req" colspan="2">You asked for</th><th class="c-team" colspan="4">Data plane team filled in</th></tr>' +
      '<tr><th class="c-req">Platform capability</th><th class="c-req">Kind</th><th class="c-team">Capability ID</th><th class="c-team">Status</th><th class="c-team">Decision</th><th class="c-team">Response or next step</th></tr></thead><tbody>' +
      r.caps.map(c => '<tr><td><b>' + esc(capName(c)) + '</b></td><td class="small">' + esc(labelOf(CAP_TYPES, c.capType)) + '</td>' +
        '<td class="c-team"><span class="chip chip-team mono">' + esc(c.t.capId) + '</span></td><td class="c-team">' + statusChip(c.t.status) + '</td>' +
        '<td class="c-team">' + decisionChip(c.t.decision) + (c.t.contract ? '<br><span class="muted small">Rules added to ' + esc(c.t.contract) + '</span>' : '') + '</td>' +
        '<td class="c-team pre">' + (esc(c.t.next) || '<span class="muted">Nothing yet</span>') + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  /* ---------- data plane team: capability rows in triage ---------- */
  function capSection(r, ri) {
    if (!r.caps.length) return '';
    const pick = Math.min(r.capSel || 0, r.caps.length - 1), dash = v => esc(v) || '<span class="muted">?</span>';
    const rows = r.caps.map((c, ci) => '<tr class="row-btn" data-act="pick-cap" data-r="' + ri + '" data-c="' + ci + '" aria-selected="' + (ci === pick) + '">' +

      '<td class="small">' + esc(labelOf(CAP_TYPES, c.capType)) + '</td><td>' + dash(c.priority) + '</td><td class="nowrap">' + dash(c.neededBy) + '</td><td>' + yn(c.regulatory) + '</td>' +

      '<div class="scroll"><table class="pin"><thead><tr class="grp"><th class="c-req" colspan="6">Requester fills</th><th class="c-team" colspan="3">Data plane team fills</th></tr>' +
      '<tr><th class="c-req">Capability ID and title</th><th class="c-req">Kind</th><th class="c-req">Priority</th><th class="c-req">Needed by</th><th class="c-req">Regulatory</th><th class="c-req num">Rules</th>' +

  function contractPicker(path) {

    return '<select class="cell-in" id="' + idOf(path) + '" data-bind="' + path + '"' + (stuck ? ' disabled' : '') + '><option value="">Not in a contract</option>' +
      state.contracts.map(k => { const lock = locked(k) && k.uid !== v; return '<option value="' + esc(k.uid) + '"' + (k.uid === v ? ' selected' : '') + (lock ? ' disabled' : '') + '>' + esc(cName(k) + ' · ' + k.f.name + (lock ? ' (locked: ' + agreement(k).toLowerCase() + ')' : '')) + '</option>'; }).join('') + '</select>';
  }
  function capDetail(r, ri, ci) {

  /* ================= view: demand by source ================= */
  function demandRows() {
    const map = new Map();
    state.requests.forEach(r => r.sources.forEach(s => {
      const k = srcKey(s);
      if (!map.has(k)) map.set(k, { name: srcName(s), desc: srcDesc(s), c: cat(s.catalog), report: false, teams: new Set(), requests: 0, elements: 0, blank: 0, contracts: [] });
      const d = map.get(k), kc = contractFor(s);
      d.teams.add(r.team); d.requests++; d.elements += els(s).length; if (!els(s).length) d.blank++; if (isReport(s)) d.report = true; if (kc) d.contracts.push(kc);
    }));
    return [...map.values()].sort((a, b) => b.teams.size - a.teams.size || b.requests - a.requests || a.name.localeCompare(b.name));
  }
  function viewDemand() {

      stat(held, 'already in our platforms') + stat(rows.filter(r => !r.elements).length, 'with no data elements listed') + stat(state.requests.reduce((n, r) => n + (r.caps || []).length, 0), 'capability asks') + '</div>' +

      'c-add-row': t => {
        const k = K(), ci = ciOf(k), list = t.dataset.list;
        const row = {
          schema: () => ({ field: '', type: '', definition: '', nullable: '', key: '', cls: '', units: '', from: '' }),
          mapping: () => ({ source: '', target: '', transform: '', lineage: '', from: '' }),
          rules: () => ({ id: nextId(k, 'rule', 'DQ'), desc: '', dim: '', scope: '', threshold: '', severity: '', freq: '', owner: '', from: '' }),
          tests: () => ({ id: nextId(k, 'test', 'AT'), criterion: '', expected: '', actual: '', outcome: 'Not run', evidence: '' })
        }[list]();
        k[list].push(row); state.errors.delete('contracts.' + ci + '.' + list);
        logC(k, 'Added a row to ' + LIST_NAME[list].toLowerCase() + (row.id ? ': ' + row.id : '') + '.', 'edit');
        render(idOf('contracts.' + ci + '.' + list + '.' + (k[list].length - 1) + '.' + LIST_FIRST[list]));
      },
      'c-rm-row': t => {
        const k = K(), list = t.dataset.list, j = Number(t.dataset.j), row = k[list][j];
        k[list].splice(j, 1);
        logC(k, 'Removed ' + (row.id || (row.field || row.source || 'a row')) + ' from ' + LIST_NAME[list].toLowerCase() + '.', 'edit'); render();
      },
      'c-raise': t => {
        const k = K(), ci = ciOf(k), from = t.dataset.from || stageName(k.view);
        const x = newIssue(k, { from, title: t.dataset.title || '' });
        k.issues.push(x); k.issueSel = k.issues.length - 1; k.tab = 'issues';
        logC(k, 'Raised ' + x.id + ' from ' + from + '.');
        render(idOf('contracts.' + ci + '.issues.' + k.issueSel + '.title')); scrollToPanel();
      },
      'c-issue': t => { const k = K(), j = Number(t.dataset.j); k.issueSel = k.issueSel === j ? -1 : j; render(); },
      'c-return-review': t => {
        const k = K(), ci = ciOf(k), key = t.dataset.k, name = reviewName(key);
        k.reviews[key].outcome = 'Failed';
        const x = newIssue(k, { from: 'Validation: ' + name, title: name + ' returned for remediation', severity: 'High', affected: name });
        k.issues.push(x); k.issueSel = k.issues.length - 1; k.tab = 'issues';
        logC(k, name + ' returned for remediation. Raised ' + x.id + '.');
        render(idOf('contracts.' + ci + '.issues.' + k.issueSel + '.title')); scrollToPanel();
      },
      'c-ev-add': () => {
        const k = K(), ci = ciOf(k), n = k.newEv, miss = ['desc', 'env', 'date'].filter(x => !filled(n[x]));
        if (miss.length) { state.errors = new Set(miss.map(x => 'contracts.' + ci + '.newEv.' + x)); render(); toast('Say what it shows, the environment and the date'); return; }
        const e = { id: nextId(k, 'ev', 'EV'), desc: n.desc.trim(), env: n.env, date: n.date, rev: k.rev, file: n.file, by: me().name };
        k.evidence.push(e); k.newEv = { desc: '', env: '', date: dayISO(0), file: null }; state.errors.clear();
        logC(k, 'Added ' + e.id + ' to the evidence register: ' + e.desc + '.'); render(); toast(e.id + ' added');
      },
      'c-ev-rm': t => {
        const k = K(), e = k.evidence.splice(Number(t.dataset.j), 1)[0];
        k.tests.forEach(x => { if (x.evidence === e.id) x.evidence = ''; });
        REVIEWS.forEach(([key]) => { k.reviews[key].evidence = k.reviews[key].evidence.filter(x => x !== e.id); });
        logC(k, 'Removed ' + e.id + ' from the evidence register.'); render();
      },
      'c-comment': () => {
        const k = K();
        if (!filled(k.comment)) { toast('Write a comment first'); return; }
        k.log.unshift({ ts: nowTs(), by: me().name, kind: 'comment', text: k.comment.trim() }); k.comment = ''; render(); toast('Comment posted');
      },
      'c-filter': t => { K().logFilter = t.dataset.f; render(); },
      'c-freeze': () => {
        const k = K();
        if (!gates(k).every(x => x.ok)) { toast('All 8 gates must pass first'); return; }
        k.frozen = { at: dayISO(0), by: me().name, rev: k.rev }; k.sign = { why: '', ack: false };
        logC(k, 'Froze the approval package at revision r' + k.rev + '. All 8 readiness gates passed.'); render(); toast('Package frozen. It is with the source owner now.');
      },
      'c-reopen': () => {
        const k = K(); k.frozen = null; k.approvals = { source: {}, target: {} }; k.rev++;
        logC(k, 'Reopened for changes. Revision r' + k.rev + ' started and approvals cleared. Evidence needs refreshing for r' + k.rev + '.'); render(); toast('Reopened as revision r' + k.rev);
      },
      'c-sign': t => {
        const k = K(), ci = ciOf(k), side = t.dataset.side, yes = t.dataset.d === 'yes', ret = t.dataset.kind === 'retire', who = side === 'source' ? k.f.sourceOwner : k.f.targetOwner, why = k.sign.why.trim();
        if (me().id !== who) { toast('Only the named owner can sign'); return; }
        if (!filled(why)) { state.errors = new Set(['contracts.' + ci + '.sign.why']); render(); toast('Give a rationale for your decision'); return; }
        if (yes && !k.sign.ack) { toast('Tick the box to confirm you reviewed it'); return; }
        if (ret && yes) {
          k.ret.approvals[side] = { by: me().name, at: dayISO(0), why };
          logC(k, (side === 'source' ? 'Source' : 'Target') + ' owner approved the cessation: ' + why);
          toast(side === 'source' ? 'Cessation approved. The target owner decides next.' : 'Both owners approved. The data plane team can decommission it.');
        } else if (ret) {
          k.ret.submitted = false; k.ret.approvals = { source: {}, target: {} };
          logC(k, me().name + ' rejected the cessation: ' + why + ' The retirement request is withdrawn and the contract stays active.');
          toast('Cessation rejected. The contract stays active.');
        } else if (yes) {
          k.approvals[side] = { by: me().name, at: dayISO(0), why };
          logC(k, (side === 'source' ? 'Source owner approved' : 'Target owner accepted') + ' revision r' + k.rev + ': ' + why);
          toast(side === 'source' ? 'Approved. It goes to the target owner next.' : 'Accepted. The data plane team can activate it.');
        } else {
          const x = newIssue(k, { from: side === 'source' ? 'Source owner approval' : 'Target owner acceptance', title: 'Returned by ' + me().name + ': ' + why, severity: 'High' });
          k.issues.push(x); k.frozen = null; k.approvals = { source: {}, target: {} }; k.rev++;
          logC(k, me().name + ' returned the package for changes and raised ' + x.id + '. Revision r' + k.rev + ' started.');
          toast('Returned to the data plane team');
        }
        k.sign = { why: '', ack: false }; state.errors.clear(); render();
      },
      'c-as': t => {
        const k = K();
        setUser(t.dataset.u); state.menuOpen = false; state.openContract = k.uid; k.view = k.ret.submitted && !k.retired ? 'retire' : 'approve'; k.tab = 'stage';
        show(ROLE_VIEWS[state.role].some(v => v[0] === 'approvals') ? 'approvals' : 'contracts'); toast('Signed in as ' + me().name + ', a sample user');
      },
      'c-activate': () => {
        const k = K(), ci = ciOf(k), a = k.act, miss = ['env', 'planned', 'release', 'auth', 'deployed', 'access', 'monitoring', 'smoke', 'catalog'].filter(x => !filled(a[x]));
        if (miss.length) { state.errors = new Set(miss.map(x => 'contracts.' + ci + '.act.' + x)); render(); toast(miss.length + (miss.length === 1 ? ' answer is' : ' answers are') + ' missing'); return; }
        if (!versionMatches(k)) { state.errors = new Set(['contracts.' + ci + '.act.deployed']); render(); toast('The deployed version must match the approved package, ' + vLabel(k)); return; }
        if (a.smoke !== 'Passed' || a.monitoring !== 'Ready') { toast('The smoke test must pass and monitoring must be ready first'); return; }
        if (expired(k)) { toast('The approvals have expired. Reopen and approve again.'); return; }
        k.active = true; k.activeAt = dayISO(0); state.errors.clear();
        logC(k, 'Verified ' + vLabel(k) + ' in ' + a.env.toLowerCase() + ' (release ' + a.release + ', authorised under ' + a.auth + ') and activated it.');
        const prev = versionsOf(k).find(x => x !== k && live(x));
        if (prev) {
          prev.superseded = { at: dayISO(0), by: cName(k) };
          logC(prev, 'Superseded by ' + cName(k) + ', which is now active. This version is kept read-only for audit.');
          state.requests.forEach(r => (r.caps || []).forEach(cp => { if (cp.t.contract === prev.uid) cp.t.contract = k.uid; }));
        }
        k.view = 'monitor'; render('c-stage-h'); toast(cName(k) + ' is active' + (prev ? ' and replaces ' + cName(prev) : ''));
      },
      'c-reject-start': () => { K().rejecting = true; render(idOf('contracts.' + ciOf(K()) + '.rejectWhy')); },
      'c-reject-cancel': () => { K().rejecting = false; state.errors.clear(); render(); },
      'c-reject-confirm': () => {
        const k = K(), ci = ciOf(k);
        if (!filled(k.rejectWhy)) { state.errors = new Set(['contracts.' + ci + '.rejectWhy']); render(); return; }
        k.rejected = k.rejectWhy.trim(); k.rejecting = false; state.errors.clear(); logC(k, 'Rejected the candidate: ' + k.rejected); render(); toast('Candidate rejected');
      },
      'c-restore': () => { const k = K(); logC(k, 'Restored the rejected candidate.'); k.rejected = ''; k.rejectWhy = ''; render(); },
      'c-open-triage': () => {
        const L = link(K());
        if (!L.r) return;
        state.picked = L.r.id; L.r.sel = L.si; state.openContract = ''; show('triage');
        const d = document.getElementById('src-detail'); if (d) d.scrollIntoView({ block: 'start' });
      }
    };
  }

  /* ================= after go-live: monitor, recertify, change and retire ================= */
  /* Health is worked out from the contract's own rules and service levels rather than picked from a list. Incidents go to
     the issues register. Recertification dates come from the terms. A change never edits the active version: it opens a
     replacement version that goes through the same stages while the active one keeps running. Retirement reuses the
     identity-checked sign-off from approval, and takes consumers, notice and retention from what the tool already holds. */
  const ENV_PROD = ['Production', 'Production, second region'];
  const READY = ['Ready', 'Not ready'];
  const SMOKE = ['Passed', 'Failed', 'Not run'];
  const MON_DELIVERY = ['On time', 'Late'];
  const RECERT_CHECKS = ['Purpose is still valid', 'Commitments are being met', 'Owners are still correct', 'Access is still appropriate'];
  const RECERT_OUT = ['Recertified', 'Recertified, changes needed', 'Not recertified: start retirement'];
  const COMPAT = ['Backward compatible', 'Breaking change'];
  const HEALTH_CLS = { 'Healthy': 'chip-good', 'Healthy so far': 'chip-good', 'Degraded': 'chip-warn', 'Breached': 'chip-crit', 'No data yet': '' };

  function newAct() { return { env: '', planned: '', release: '', auth: '', deployed: '', access: '', monitoring: '', smoke: '', catalog: '' }; }
  function newChg() { return { reason: '', compat: '', notes: '', emergency: false, authority: '' }; }
  function newRet() { return { reason: '', date: '', notified: '', plan: '', submitted: false, at: '', by: '', approvals: { source: {}, target: {} }, access: '', shutdown: '', disposition: '', cleared: [] }; }

  /* ---------- versions ---------- */
  function vLabel(k) { return 'v' + k.version + ' · r' + k.rev; }
  function cName(k) { return k.id + (k.version > 1 ? ' v' + k.version : ''); }
  function versionsOf(k) { return state.contracts.filter(x => x.id === k.id).sort((a, b) => a.version - b.version); }
  function newerOf(k) { return versionsOf(k).find(x => x.version > k.version && !x.rejected && !x.retired && !x.superseded); }
  const squash = v => String(v || '').replace(/\s+/g, '').toLowerCase();
  function versionMatches(k) { return !!k.act.deployed.trim() && squash(k.act.deployed) === squash(vLabel(k)); }
  function deployCheck(k) {
    return !k.act.deployed.trim() ? '<span class="chip">Not checked yet</span>' : versionMatches(k) ? '<span class="chip chip-good">&#10003; Matches the approved package</span>' : '<span class="chip chip-crit">Does not match ' + esc(vLabel(k)) + '</span>';
  }
  function versionStrip(k) {
    const list = versionsOf(k), prev = list.find(x => x.uid === k.replaces);
    const why = k.change ? '<p class="note note-team">Replacement candidate for ' + esc(prev ? cName(prev) : 'the previous version') + ', which keeps running until this one goes live. Change: ' + esc(k.change.reason) + ' (' + esc(k.change.compat.toLowerCase()) + (k.change.emergency ? ', emergency, authorised by ' + esc(k.change.authority) : '') + ').</p>' : '';
    if (list.length < 2) return why;
    return '<div class="facts versions"><span class="muted small">Versions</span>' + list.map(x => '<button type="button" class="chip chip-btn' + (x === k ? ' chip-team' : '') + '" data-act="c-open" data-id="' + esc(x.uid) + '"' + (x === k ? ' aria-current="true"' : '') + '>v' + x.version + ': ' +
      esc(x.retired ? 'retired' : x.superseded ? 'superseded' : live(x) ? 'active' : agreement(x).toLowerCase()) + '</button>').join('') + '</div>' + why;
  }
  function cloneVersion(k) {
    const n = Math.max(...versionsOf(k).map(x => x.version)) + 1, c = JSON.parse(JSON.stringify(k)), by = me().name;
    Object.assign(c, {
      uid: k.id + '-v' + n, version: n, rev: 1, replaces: k.uid, created: dayISO(0), createdBy: by,
      view: 'scope', tab: 'stage', build: 'schema', issueSel: -1, logFilter: 'all', comment: '', gaps: null, rejecting: false, rejectWhy: '', rejected: '',
      done: {}, frozen: null, active: false, activeAt: '', approvals: { source: {}, target: {} }, sign: { why: '', ack: false },
      evidence: [], issues: [], newEv: { desc: '', env: '', date: dayISO(0), file: null },
      act: newAct(), mon: { run: '', values: {}, delivery: '' }, recerts: [], recertDraft: { checks: [], outcome: '', note: '' },
      suspended: null, suspendWhy: '', changing: false, chg: newChg(), ret: newRet(), retired: null, superseded: null,
      change: Object.assign({}, k.chg, { at: dayISO(0), by }), seq: { issue: 0, ev: 0, rule: k.seq.rule, test: k.seq.test }
    });
    c.tests.forEach(t => Object.assign(t, { actual: '', outcome: 'Not run', evidence: '' }));
    REVIEWS.forEach(([key]) => { c.reviews[key] = { outcome: 'Not started', reviewer: k.reviews[key].reviewer, why: '', checks: [], evidence: [], extra: k.reviews[key].extra }; });
    c.log = [{ ts: nowTs(), by, kind: 'event', text: 'Created as replacement candidate v' + n + ' for ' + cName(k) + ', copying its terms, schema, mapping, rules and tests. Tests, reviews, evidence and approvals start again. Change: ' + k.chg.reason.trim() + ' (' + k.chg.compat.toLowerCase() + ').' }];
    return c;
  }

  /* ---------- health ---------- */
  function meets(threshold, value) {
    if (!filled(value)) return null;
    const v = parseFloat(String(value).replace(/[^0-9.\-]/g, ''));
    if (isNaN(v)) return null;
    const t = String(threshold || '').toLowerCase();
    if (/zero/.test(t)) return v === 0;
    const n = parseFloat(t.replace(/[^0-9.]/g, ''));
    return isNaN(n) ? null : v >= n;
  }
  function monitorRows(k) {
    const rows = k.rules.filter(r => filled(r.desc)).map(r => {
      const v = k.mon.values[r.id] || '';
      return { id: r.id, label: r.desc, threshold: r.threshold, window: r.freq, path: 'mon.values.' + r.id, value: v, met: meets(r.threshold, v), severity: r.severity };
    });
    const d = k.mon.delivery;
    rows.push({ id: 'SLA', label: 'Delivered within the freshness commitment', threshold: k.f.freshness, window: k.f.schedule, path: 'mon.delivery', value: d, met: d ? d === 'On time' : null, severity: 'High', sel: true });
    return rows;
  }
  function health(k) {
    const rows = monitorRows(k), seen = rows.filter(r => r.met !== null);
    if (!seen.length) return 'No data yet';
    if (rows.some(r => r.met === false && (r.severity === 'Critical' || r.severity === 'High'))) return 'Breached';
    if (rows.some(r => r.met === false)) return 'Degraded';
    return seen.length < rows.length ? 'Healthy so far' : 'Healthy';
  }
  function healthChip(h) { return '<span class="chip ' + (HEALTH_CLS[h] || '') + '">' + esc(h) + '</span>'; }
  function resultChip(r) { return r.met === null ? '<span class="chip">No value yet</span>' : r.met ? '<span class="chip chip-good">&#10003; Met</span>' : '<span class="chip chip-crit">Breached</span>'; }
  function recertDue(k) { return addMonths(k.recerts.length ? k.recerts[0].at : k.activeAt, parseInt(k.f.recert, 10) || 12); }
  function noticeDays(k) { const m = /(\d+)\s*(?:calendar\s+|business\s+)?days?/i.exec(k.f.change || ''); return m ? Number(m[1]) : 0; }
  /* Consumers come from what the tool already knows: the request, other requests for the same source, and requested rules. */
  function dependencies(k) {
    const L = link(k), out = [];
    if (L.r) out.push({ key: 'req-' + L.r.id, label: k.team + ': ' + L.r.id + ', the request this contract serves' });
    if (L.s) state.requests.forEach(r => r.sources.forEach(s => { if (s !== L.s && srcKey(s) === srcKey(L.s)) out.push({ key: 'row-' + s.t.reqId, label: r.team + ': ' + s.t.reqId + ' in ' + r.id + ' asks for the same source' }); }));
    state.requests.forEach(r => (r.caps || []).forEach(cp => { if (cp.t.contract === k.uid) out.push({ key: 'cap-' + cp.t.capId, label: r.team + ': rules requested in ' + cp.t.capId + ' run under this contract' }); }));
    return out;
  }
  /* Live feedback while typing, without a full redraw. */
  function contractInput(p, t) {
    const m = /^contracts\.(\d+)\.(mon\.values\.|act\.deployed)/.exec(p), k = m && state.contracts[Number(m[1])];
    if (!k) return;
    if (m[2] === 'act.deployed') { const el = document.getElementById('deploy-check'); if (el) el.innerHTML = deployCheck(k); return; }
    const row = t.closest('tr'), cell = row && row.querySelector('.mon-res'), r = row && monitorRows(k).find(x => x.id === row.dataset.metric);
    if (cell && r) cell.innerHTML = resultChip(r);
    const h = document.getElementById('mon-health'); if (h) h.innerHTML = healthChip(health(k));
  }

  /* ---------- stage 8: monitor, recertify and change ---------- */
  function stageMonitor(k, ci, ro) {
    if (!k.active) return '<p class="note">Monitoring starts once the contract is active. Right now it is <b>' + esc(agreement(k).toLowerCase()) + '</b>.</p>';
    const p = 'contracts.' + ci + '.', rows = monitorRows(k), due = recertDue(k), left = -ageDays(due), nx = newerOf(k), deps = dependencies(k);
    const incidents = k.issues.filter(x => /^Monitoring/.test(x.from) && x.status !== 'Closed');
    const notes = (k.superseded ? '<p class="note note-team"><b>Superseded</b> by ' + esc(k.superseded.by) + ' on ' + esc(k.superseded.at) + '. This version is kept read-only for audit.</p>' : '') +
      (k.retired ? '<p class="note"><b>Retired</b> on ' + esc(k.retired.at) + ' by ' + esc(k.retired.by) + '. Kept read-only for audit.</p>' : '') +
      (k.suspended ? '<p class="note note-crit"><b>Delivery suspended</b> on ' + esc(k.suspended.at) + ' by ' + esc(k.suspended.by) + ': ' + esc(k.suspended.why) + '</p>' : '') +
      (nx && !k.superseded ? '<div class="banner"><span>Replacement candidate <b>' + esc(cName(nx)) + '</b> is ' + esc(agreement(nx).toLowerCase()) + '. This version keeps running until it goes live.</span><button type="button" class="btn" data-act="c-open" data-id="' + esc(nx.uid) + '">Open ' + esc(cName(nx)) + '</button></div>' : '');
    const table = '<div class="scroll"><table class="ctab ctab-mon"><thead><tr><th>Rule or service level</th><th>Threshold</th><th>Checked</th><th>Latest value</th><th>Result</th>' + (ro ? '' : '<th><span class="vh">Actions</span></th>') + '</tr></thead><tbody>' +
      rows.map(r => '<tr data-metric="' + esc(r.id) + '"><td><span class="mono">' + esc(r.id) + '</span> ' + esc(r.label) + '<br><span class="muted small">Severity: ' + esc(r.severity || 'not set') + '</span></td>' +
        '<td class="small">' + (esc(r.threshold) || '<span class="muted">Not set</span>') + '</td><td class="small">' + esc(r.window || '') + '</td>' +
        '<td>' + (r.sel ? cSel(p + r.path, MON_DELIVERY, 'Latest result: ' + r.label, { ro }) : cIn(p + r.path, 'Latest value for ' + r.id, { ro, ph: 'For example 99.8%' })) + '</td>' +
        '<td class="mon-res">' + resultChip(r) + '</td>' +
        (ro ? '' : '<td class="nowrap">' + (r.met === false && !incidents.some(x => x.from === 'Monitoring: ' + r.id) ? '<button type="button" class="btn btn-quiet" data-act="c-incident" data-rule="' + esc(r.id) + '">Raise an incident</button>' : '') + '</td>') + '</tr>').join('') + '</tbody></table></div>';
    const recRows = k.recerts.map(x => '<tr><td class="nowrap">' + esc(x.at) + '</td><td>' + esc(x.by) + '</td><td>' + esc(x.outcome) + '</td><td class="small">' + esc(x.note) + '</td></tr>').join('');
    const recert = '<div class="sub"><div class="card-head"><h3>Recertification</h3><span class="chip ' + (left < 0 ? 'chip-crit' : left <= 30 ? 'chip-warn' : '') + '">' + (left < 0 ? 'Overdue by ' + (-left) + ' days' : 'Due ' + esc(due) + (left <= 60 ? ', in ' + left + ' days' : '')) + '</span></div>' +
      '<p class="muted small">Every ' + esc(k.f.recert || '12 months') + ', as set in the terms, counted from ' + (k.recerts.length ? 'the last recertification' : 'activation on ' + esc(k.activeAt)) + '.</p>' +
      (recRows ? '<div class="scroll"><table><thead><tr><th>Date</th><th>By</th><th>Outcome</th><th>Note</th></tr></thead><tbody>' + recRows + '</tbody></table></div>' : '<p class="muted small">Not recertified yet.</p>') +
      (ro ? '' : '<div class="grid2">' + fChecks('Confirmed at this recertification', p + 'recertDraft.checks', RECERT_CHECKS, { wide: true, stack: true, hint: 'Ownership check right now: ' + owners(k).detail }) +
        fSelect('Outcome', p + 'recertDraft.outcome', RECERT_OUT) + fText('Note', p + 'recertDraft.note', { ph: 'What was reviewed, and with whom' }) + '</div>' +
        '<div class="btn-row"><button type="button" class="btn btn-primary" data-act="c-recert">Record recertification</button></div>') + '</div>';
    const nextV = Math.max(...versionsOf(k).map(x => x.version)) + 1;
    const change = '<div class="sub"><h3>Change</h3>' + (nx ? '<p class="muted small">' + esc(cName(nx)) + ' is already in progress. Finish or reject it before starting another.</p>'
      : !k.changing ? '<p class="muted small">A change never edits the active version. It opens a replacement candidate that goes through the same stages while this one keeps running, then takes over when it goes live.</p>' +
        (ro ? '' : '<div class="btn-row"><button type="button" class="btn" data-act="c-change-start">Create new version</button></div>')
      : '<div class="grid2">' + fText('Change reason and impact', p + 'chg.reason', { wide: true, area: true, rows: 2 }) +
        fSelect('Compatibility', p + 'chg.compat', COMPAT, { hint: 'Notice rules from the terms: ' + (k.f.change || 'not set') + '.' }) +
        '<label class="choice align-end"><input type="checkbox" id="' + idOf(p + 'chg.emergency') + '" data-bind="' + p + 'chg.emergency"' + (k.chg.emergency ? ' checked' : '') + '><span>Emergency change</span></label>' +

    const done = k.retired ? '<p class="note"><b>Retired</b> on ' + esc(k.retired.at) + ' by ' + esc(k.retired.by) + '. Kept read-only for audit.</p>' : '';
    const part1 = '<div class="sub"><h3>1. Retirement request</h3>' + (nx ? '<p class="note">' + esc(cName(nx)) + ' is in progress as a replacement. If it will take over these consumers, let it supersede this version instead of retiring it.</p>' : '') +

      (nd && gap != null && gap < nd ? '<p class="err f-wide">Only ' + gap + ' days between the notice and the retirement date. The terms ask for ' + nd + '.</p>' : '') +
      fText('Replacement or migration plan', p + 'plan', { ro: reqRO, wide: true, area: true, rows: 2, opt: true }) +
      '<div class="kv f-wide"><span>Active consumers and dependencies</span><b>' + (deps.map(d => esc(d.label)).join('<br>') || 'None found') + '</b><span class="hint">From the requests and contracts on this source, so nobody lists them by hand.</span></div></div>' +

      (team && !k.retired && r.submitted && !both ? '<div class="btn-row"><button type="button" class="btn" data-act="c-ret-withdraw">Withdraw the request</button></div>' : '') + '</div>';
    const part2 = '<div class="sub"><h3>2. Cessation decisions</h3><p class="muted small">The same identity-checked sign-off as approval: the named source owner decides first, then the target owner.</p>' +
      '<div class="signoffs">' + signCard(k, ci, 'source', 'retire') + signCard(k, ci, 'target', 'retire') + '</div></div>';
    const part3 = '<div class="sub"><h3>3. Decommission</h3>' + (!both && !k.retired ? '<p class="muted small">Opens once both owners approve the cessation.</p>' : '') +
      '<div class="grid2">' + fText('Access revocation results', p + 'access', { ro: decRO, area: true, rows: 2 }) + fText('Delivery shutdown results', p + 'shutdown', { ro: decRO, area: true, rows: 2 }) +

  function lifecycleActions() {
    const K = () => openC();
    return {
      'c-incident': t => {
        const k = K(), ci = ciOf(k), r = monitorRows(k).find(x => x.id === t.dataset.rule);
        if (!r) return;
        const x = newIssue(k, { from: 'Monitoring: ' + r.id, title: r.id + ' breached: ' + (r.value || 'no value') + ' against ' + (r.threshold || 'no threshold'), severity: r.severity || 'High', blocker: 'no', due: dayISO(r.severity === 'Critical' ? 1 : 5) });
        k.issues.push(x); k.issueSel = k.issues.length - 1; k.tab = 'issues';
        logC(k, 'Raised incident ' + x.id + ': ' + x.title + '.');
        render(idOf('contracts.' + ci + '.issues.' + k.issueSel + '.owner')); scrollToPanel(); toast('Incident ' + x.id + ' raised. Name the response owner.');
      },
      'c-recert': () => {
        const k = K(), ci = ciOf(k), d = k.recertDraft, stop = d.outcome === RECERT_OUT[2], miss = ['outcome', 'note'].filter(x => !filled(d[x]));
        if (miss.length) { state.errors = new Set(miss.map(x => 'contracts.' + ci + '.recertDraft.' + x)); render(); toast('Choose an outcome and add a note'); return; }
        if (!stop && !(d.checks.includes(RECERT_CHECKS[0]) && d.checks.includes(RECERT_CHECKS[1]))) { state.errors = new Set(['contracts.' + ci + '.recertDraft.checks']); render(); toast('Confirm the purpose and the commitments, or choose Not recertified'); return; }
        if (d.outcome === RECERT_OUT[0] && health(k) === 'Breached') { toast('A rule or service level is breached. Recertify with changes needed, or fix it first.'); return; }
        k.recerts.unshift({ at: dayISO(0), by: me().name, outcome: d.outcome, note: d.note.trim(), checks: d.checks.slice() });
        logC(k, 'Recorded recertification: ' + d.outcome.toLowerCase() + '. ' + d.note.trim() + (stop ? '' : ' Next due ' + recertDue(k) + '.'));
        k.recertDraft = { checks: [], outcome: '', note: '' }; state.errors.clear();
        if (stop) {
          k.view = 'retire'; if (!filled(k.ret.reason)) k.ret.reason = 'Not recertified on ' + dayISO(0) + ': ' + k.recerts[0].note;
          render('c-stage-h'); scrollToPanel(); toast('Not recertified. The retirement request is started for you.'); return;
        }
        if (d.outcome === RECERT_OUT[1] && !newerOf(k)) { k.changing = true; render(idOf('contracts.' + ci + '.chg.reason')); toast('Recertified. Describe the change to open a new version.'); return; }
        render(); toast('Recertified. Next due ' + recertDue(k));
      },
      'c-change-start': () => { const k = K(); k.changing = true; render(idOf('contracts.' + ciOf(k) + '.chg.reason')); },
      'c-change-cancel': () => { const k = K(); k.changing = false; k.chg = newChg(); state.errors.clear(); render(); },
      'c-change-create': () => {
        const k = K(), ci = ciOf(k), c = k.chg, miss = ['reason', 'compat'].filter(x => !filled(c[x])).concat(c.emergency && !filled(c.authority) ? ['authority'] : []);
        if (miss.length) { state.errors = new Set(miss.map(x => 'contracts.' + ci + '.chg.' + x)); render(); toast('Give the reason and compatibility' + (c.emergency ? ', and who authorised the emergency change' : '')); return; }
        const v = cloneVersion(k);
        state.contracts.unshift(v);
        logC(k, 'Opened replacement candidate ' + cName(v) + ': ' + c.reason.trim() + ' (' + c.compat.toLowerCase() + '). This version keeps running until it goes live.');
        k.changing = false; k.chg = newChg(); state.errors.clear();
        openContract(v.uid); toast(cName(v) + ' created. ' + cName(k) + ' keeps running.');
      },
      'c-suspend': () => {
        const k = K(), ci = ciOf(k);
        if (!filled(k.suspendWhy)) { state.errors = new Set(['contracts.' + ci + '.suspendWhy']); render(); toast('Say why delivery is being suspended'); return; }
        k.suspended = { at: dayISO(0), by: me().name, why: k.suspendWhy.trim() }; k.suspendWhy = ''; state.errors.clear();
        logC(k, 'Suspended delivery: ' + k.suspended.why); render(); toast('Delivery suspended');
      },
      'c-resume': () => { const k = K(); logC(k, 'Resumed delivery, suspended since ' + k.suspended.at + '.'); k.suspended = null; render(); toast('Delivery resumed'); },
      'c-ret-submit': () => {
        const k = K(), ci = ciOf(k), r = k.ret, miss = ['reason', 'date', 'notified'].filter(x => !filled(r[x]));
        if (miss.length) { state.errors = new Set(miss.map(x => 'contracts.' + ci + '.ret.' + x)); render(); toast('Give the reason, the proposed date and when consumers were told'); return; }
        r.submitted = true; r.at = dayISO(0); r.by = me().name; r.approvals = { source: {}, target: {} };
        if (!filled(r.disposition) && k.f.retention) r.disposition = 'Per the terms: ' + k.f.retention;
        state.errors.clear(); logC(k, 'Requested retirement on ' + r.date + ': ' + r.reason.trim() + ' Sent to ' + userName(k.f.sourceOwner) + ' for a cessation decision.');
        render(); toast('Sent to ' + userName(k.f.sourceOwner) + ' for a cessation decision');
      },
      'c-ret-withdraw': () => { const k = K(); k.ret.submitted = false; k.ret.approvals = { source: {}, target: {} }; logC(k, 'Withdrew the retirement request.'); render(); toast('Retirement request withdrawn'); },
      'c-retire': () => {
        const k = K(), ci = ciOf(k), r = k.ret, miss = ['access', 'shutdown', 'disposition'].filter(x => !filled(r[x]));
        if (miss.length) { state.errors = new Set(miss.map(x => 'contracts.' + ci + '.ret.' + x)); render(); toast('Record the access revocation, the shutdown and the disposition'); return; }
        const open = dependencies(k).filter(d => !r.cleared.includes(d.key));
        if (open.length) { state.errors = new Set(['contracts.' + ci + '.ret.cleared']); render(); toast(open.length + (open.length === 1 ? ' consumer is' : ' consumers are') + ' not cleared yet'); return; }
        k.retired = { at: dayISO(0), by: me().name }; state.errors.clear();
        logC(k, 'Completed retirement: access revoked, deliveries stopped, and the data handled under the retention terms.');
        render(); toast(cName(k) + ' is retired');
      }
    };
  }
